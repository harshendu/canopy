[project]
name = "canopy-backend"
version = "0.1.0"
description = "Canopy — software architecture & project management backend"
license = "Apache-2.0"
authors = [{ name = "Harshendu Patel" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # <0.0.45: SQLModel 0.0.45 maps `datetime` to a tz-aware UTCDateTime that rejects the naive UTC
    # datetimes canopy stores on purpose (see "Naive UTC datetimes only" in CLAUDE.md).
    "sqlmodel>=0.0.16,<0.0.45",
    "asyncpg>=0.29",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "greenlet>=3.0",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "networkx>=3.2",
    "cryptography>=42.0",
    "arq>=0.25",
    "redis>=5.0",
    "reportlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/harshendu/canopy"
Source = "https://github.com/harshendu/canopy"
Issues = "https://github.com/harshendu/canopy/issues"

[project.optional-dependencies]
# ruff + mypy are pinned exactly: a new release can add lint rules or tighten inference and turn a
# fresh clone's CI red with no code change. Bump them deliberately (Dependabot opens the PRs).
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff==0.17.0",
    "mypy==2.4.0",
]
# Async MySQL / MariaDB driver. Postgres (asyncpg) and SQLite (aiosqlite) ship in the
# core deps; install this extra to run the backend against MySQL/MariaDB:
#   pip install -e ".[mysql]"   and set DATABASE_URL=mysql+aiomysql://user:pass@host/db
mysql = [
    "aiomysql>=0.2",
]
# Optional S3 backend for the file-drop ingest poll (FILE_DROP_BACKEND=s3). The local-directory
# backend needs no extra deps; install this only for cloud deployments using S3:
#   pip install -e ".[s3]"
s3 = [
    "boto3>=1.34",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "ASYNC",    # flake8-async
    "PIE",      # flake8-pie
    "RET",      # flake8-return
    "ANN",      # flake8-annotations (every def must be typed)
    "RUF",      # ruff-specific
]
ignore = [
    "ANN401",   # allow explicit Any at boundaries (e.g. validators)
    "B008",     # FastAPI uses callables (Depends) in argument defaults
    "RET504",   # assignment-before-return aids readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]                 # tests don't need full type annotations
"alembic/*" = ["ANN", "E", "F", "I"]  # generated migration boilerplate

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["networkx.*", "arq.*", "google.*", "jose.*", "reportlab.*", "boto3.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
