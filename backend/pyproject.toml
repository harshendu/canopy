[project]
name = "canopy-backend"
version = "0.1.0"
description = "Canopy — software architecture & project management backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlmodel>=0.0.16",
    "asyncpg>=0.29",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "greenlet>=3.0",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "networkx>=3.2",
    "cryptography>=42.0",
    "arq>=0.25",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "ASYNC",    # flake8-async
    "PIE",      # flake8-pie
    "RET",      # flake8-return
    "ANN",      # flake8-annotations (every def must be typed)
    "RUF",      # ruff-specific
]
ignore = [
    "ANN401",   # allow explicit Any at boundaries (e.g. validators)
    "B008",     # FastAPI uses callables (Depends) in argument defaults
    "RET504",   # assignment-before-return aids readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]                 # tests don't need full type annotations
"alembic/*" = ["ANN", "E", "F", "I"]  # generated migration boilerplate

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["networkx.*", "arq.*", "google.*", "jose.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
