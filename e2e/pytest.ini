[pytest]
addopts = -ra -q
testpaths = tests
markers =
    smoke: minimal end-to-end sanity that the app shell loads
    auth: authentication and access flows (USER_FLOWS §A)
    nav: sidebar navigation across the app shell
    projects: project create / open flows (USER_FLOWS §B)
    planning: WBS + CPM scheduling flows (USER_FLOWS §C)
