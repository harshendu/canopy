[pytest]
addopts = -ra -q
testpaths = tests
markers =
    smoke: minimal end-to-end sanity that the app shell loads
    auth: authentication and access flows (USER_FLOWS §A)
    nav: sidebar navigation across the app shell
    projects: project create / open flows (USER_FLOWS §B)
    planning: WBS + CPM scheduling flows (USER_FLOWS §C)
    initiatives: program layer + cross-project critical path (USER_FLOWS §R)
    board: flow board / WIP / aging (USER_FLOWS §C9)
    team: team roster + add engineer (USER_FLOWS §F)
    capacity: per-project + org-wide capacity (USER_FLOWS §F)
    decisions: ADRs + fitness functions (USER_FLOWS §G)
    drift: architecture drift + staleness (USER_FLOWS §N)
    risk: risk dashboard (USER_FLOWS §Q)
    forecast: probabilistic forecast (USER_FLOWS §C8)
    blockers: flagged impediments (USER_FLOWS §D0/§M)
    connectors: connector management + mocked Jira sync (USER_FLOWS §J)
