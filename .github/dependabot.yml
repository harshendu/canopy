# Weekly dependency PRs, validated by CI before anyone merges them. Minor/patch bumps are
# grouped per ecosystem to keep the queue short; majors arrive one per PR because those are the
# ones that break things (e.g. the pinned ruff/mypy and the capped sqlmodel/fastmcp).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /plugin/mcp_server
    schedule:
      interval: weekly
    groups:
      plugin-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: [/backend, /frontend, /plugin]
    schedule:
      interval: monthly
