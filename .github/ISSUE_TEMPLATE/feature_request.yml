name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and who is affected (architect, engineering manager, engineer, leadership, Claude…).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like canopy to do?
      description: The behaviour you'd like. Sketches, example API calls or MCP tool shapes are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Anything you've tried, or how you handle this today.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to open a pull request for this.
